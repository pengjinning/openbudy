appId: com.workbuddy.clone
productName: WorkBuddy Clone
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - zip
linux:
  target:
    - AppImage
    - deb
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
